name: Build and test WFC

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned lint tools
        shell: pwsh
        run: |
          python -m pip install --requirement requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 `
            -Scope CurrentUser -Force

      - name: Lint
        shell: pwsh
        run: ./scripts/Invoke-Lint.ps1

  build:
    name: Debug ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            preset: windows-x86-debug
            runner: windows-2022
          - arch: x64
            preset: windows-x64-debug
            runner: windows-2022
          - arch: arm64
            preset: windows-arm64-debug
            runner: windows-11-arm

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure
        shell: pwsh
        run: cmake --preset '${{ matrix.preset }}'

      - name: Record runner context
        shell: pwsh
        run: |
          $directory = 'out/test-results/${{ matrix.arch }}'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $cachePath = 'out/build/${{ matrix.preset }}/CMakeCache.txt'
          $cache = Get-Content -LiteralPath $cachePath
          function Get-CacheValue([string]$Name) {
            $entry = $cache | Where-Object { $_ -match "^${Name}:[^=]*=" } |
              Select-Object -First 1
            if ($entry) { return ($entry -split '=', 2)[1] }
            return $null
          }
          $cmakeFiles = 'out/build/${{ matrix.preset }}/CMakeFiles'
          $compilerFile = Get-ChildItem $cmakeFiles `
              -Filter CMakeCXXCompiler.cmake -File -Recurse |
            Select-Object -First 1
          function Get-CMakeSetValue([string]$Name) {
            $pattern = '^set\(' + [regex]::Escape($Name) + ' "([^"]*)"\)'
            $match = Select-String -LiteralPath $compilerFile.FullName `
              -Pattern $pattern | Select-Object -First 1
            if ($match) { return $match.Matches[0].Groups[1].Value }
            return $null
          }
          [xml]$project = Get-Content `
            'out/build/${{ matrix.preset }}/wfc.vcxproj' -Raw
          $sdk = $project.SelectSingleNode(
            "//*[local-name()='WindowsTargetPlatformVersion']").InnerText
          [PSCustomObject]@{
            schemaVersion = 1
            sourceRevision = '${{ github.sha }}'
            targetArchitecture = '${{ matrix.arch }}'
            configuration = 'Debug'
            configurePreset = '${{ matrix.preset }}'
            runner = '${{ matrix.runner }}'
            runnerArchitecture = $env:RUNNER_ARCH
            runnerOs = $env:RUNNER_OS
            imageOs = $env:ImageOS
            imageVersion = $env:ImageVersion
            cmakeVersion = (& cmake --version)[0]
            ctestVersion = (& ctest --version)[0]
            cmakeGenerator = Get-CacheValue 'CMAKE_GENERATOR'
            generatorInstance = Get-CacheValue 'CMAKE_GENERATOR_INSTANCE'
            generatorPlatform = Get-CacheValue 'CMAKE_GENERATOR_PLATFORM'
            cxxCompiler = Get-CMakeSetValue 'CMAKE_CXX_COMPILER'
            cxxCompilerId = Get-CMakeSetValue 'CMAKE_CXX_COMPILER_ID'
            cxxCompilerVersion = Get-CMakeSetValue 'CMAKE_CXX_COMPILER_VERSION'
            windowsSdkVersion = $sdk
            wspRevision = (git -C wsp rev-parse HEAD)
            wcrtRevision = (git -C wcrt rev-parse HEAD)
          } | ConvertTo-Json -Depth 3 |
            Set-Content "$directory/context.json" -Encoding utf8NoBOM

      - name: Build
        shell: pwsh
        run: ./scripts/Invoke-Build.ps1 -Preset '${{ matrix.preset }}'

      - name: Test
        shell: pwsh
        run: |
          $result = Join-Path $PWD `
            'out/test-results/${{ matrix.arch }}/ctest.xml'
          ./scripts/Invoke-Tests.ps1 -Preset '${{ matrix.preset }}' `
            -JUnitPath $result

      - name: Record tested artifact identities
        if: always()
        shell: pwsh
        run: |
          $directory = 'out/test-results/${{ matrix.arch }}'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $binaryDirectory = 'out/build/${{ matrix.preset }}/Debug'
          $artifacts = @(
            Get-ChildItem -LiteralPath $binaryDirectory -File `
                -ErrorAction SilentlyContinue |
              Where-Object Extension -In '.exe', '.lib', '.pdb' |
              Sort-Object Name |
              ForEach-Object {
                [PSCustomObject]@{
                  name = $_.Name
                  size = $_.Length
                  sha256 = (Get-FileHash -LiteralPath $_.FullName `
                      -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              }
          )
          [PSCustomObject]@{
            schemaVersion = 1
            sourceRevision = '${{ github.sha }}'
            targetArchitecture = '${{ matrix.arch }}'
            configuration = 'Debug'
            jobStatusAtCollection = '${{ job.status }}'
            artifacts = $artifacts
          } | ConvertTo-Json -Depth 4 |
            Set-Content "$directory/artifacts.json" -Encoding utf8NoBOM

      - name: Upload Debug evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wfc-${{ matrix.arch }}-debug-${{ github.sha }}
          path: |
            out/build/${{ matrix.preset }}/Debug/*.exe
            out/build/${{ matrix.preset }}/Debug/*.lib
            out/build/${{ matrix.preset }}/Debug/*.pdb
            out/build/${{ matrix.preset }}/CMakeCache.txt
            out/build/${{ matrix.preset }}/CMakeFiles/*/CMakeCXXCompiler.cmake
            out/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            out/test-results/${{ matrix.arch }}/*.json
            out/test-results/${{ matrix.arch }}/*.xml
            out/build/${{ matrix.preset }}/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            preset: windows-x86-release
            runner: windows-2022
          - arch: x64
            preset: windows-x64-release
            runner: windows-2022
          - arch: arm64
            preset: windows-arm64-release
            runner: windows-11-arm

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure
        shell: pwsh
        run: cmake --preset '${{ matrix.preset }}'

      - name: Build
        shell: pwsh
        run: ./scripts/Invoke-Build.ps1 -Preset '${{ matrix.preset }}'

      - name: Test
        shell: pwsh
        run: |
          $result = Join-Path $PWD `
            'out/test-results/${{ matrix.arch }}-release/ctest.xml'
          ./scripts/Invoke-Tests.ps1 -Preset '${{ matrix.preset }}' `
            -JUnitPath $result

      - name: Record Release artifact identities
        if: always()
        shell: pwsh
        run: |
          $directory = 'out/test-results/${{ matrix.arch }}-release'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $binaryDirectory = 'out/build/${{ matrix.preset }}/Release'
          $artifacts = @(
            Get-ChildItem -LiteralPath $binaryDirectory -File `
                -ErrorAction SilentlyContinue |
              Where-Object Extension -In '.exe', '.dll' |
              Sort-Object Name |
              ForEach-Object {
                [PSCustomObject]@{
                  name = $_.Name
                  size = $_.Length
                  sha256 = (Get-FileHash -LiteralPath $_.FullName `
                      -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              }
          )
          [PSCustomObject]@{
            schemaVersion = 1
            sourceRevision = '${{ github.sha }}'
            targetArchitecture = '${{ matrix.arch }}'
            configuration = 'Release'
            jobStatusAtCollection = '${{ job.status }}'
            artifacts = $artifacts
          } | ConvertTo-Json -Depth 4 |
            Set-Content "$directory/artifacts.json" -Encoding utf8NoBOM

      - name: Collect package input
        shell: pwsh
        run: >
          ./scripts/Build-WpmPackage.ps1 -Collect
          -Architectures '${{ matrix.arch }}'

      - name: Upload package input
        uses: actions/upload-artifact@v7
        with:
          name: wfc-${{ matrix.arch }}-package-input
          path: out/package-input/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wfc-${{ matrix.arch }}-release-${{ github.sha }}
          path: |
            out/build/${{ matrix.preset }}/Release/*.exe
            out/test-results/${{ matrix.arch }}-release/*.json
            out/test-results/${{ matrix.arch }}-release/*.xml
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Signed WPM packages
    # Only a version tag builds the signed packages; publishing stays a
    # separate step that needs the owner's approval of the exact files.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, release]
    runs-on: windows-2022
    timeout-minutes: 30
    environment: release

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Download package input
        uses: actions/download-artifact@v7
        with:
          pattern: wfc-*-package-input
          path: out/package-input-download

      - name: Arrange package input
        shell: pwsh
        run: |
          foreach ($arch in 'x86', 'x64', 'arm64') {
            $from = "out/package-input-download/wfc-$arch-package-input"
            if (-not (Test-Path "$from/wfc.exe")) {
              throw "Missing package input for $arch."
            }
            New-Item -ItemType Directory -Force "out/package-input" | Out-Null
            Move-Item $from "out/package-input/$arch"
          }

      - name: Install WPM
        shell: pwsh
        run: |
          $version = '1.0.16'
          $archive = Join-Path $env:RUNNER_TEMP "wpm-x64-$version.zip"
          $expected = '6553898f4e0bfbf171f601c16d314259' +
            'fd28f59e7398d58a0549208b011c6544'
          $base = 'https://github.com/Thewafflication/wpm/releases/download'
          $url = "$base/$version/wpm-x64-$version.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw 'Pinned WPM archive digest mismatch.'
          }
          $package = Join-Path $env:RUNNER_TEMP 'wpm-package'
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          & (Join-Path $package 'setup.cmd') (Join-Path $package 'wpm.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wpmDirectory = Join-Path $env:ProgramFiles 'WPM'
          $wpmExe = Join-Path $wpmDirectory 'wpm.exe'
          $reported = (& $wpmExe --version 2>&1) -join "`n"
          if ($reported -notmatch 'Version 1\.0\.16') {
            throw "Unexpected WPM version: $reported"
          }
          $wpmDirectory >> $env:GITHUB_PATH

      - name: Build and verify the signed packages
        shell: pwsh
        env:
          WPM_PRIVATE_KEY: ${{ secrets.WPM_RELEASE_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WPM_PRIVATE_KEY)) {
            throw 'The release environment must define WPM_RELEASE_PRIVATE_KEY.'
          }
          if (-not (Test-Path release_keys/wfc-release.public)) {
            throw 'release_keys/wfc-release.public is missing.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'wfc-release.private'
          try {
            [IO.File]::WriteAllText($keyPath, $env:WPM_PRIVATE_KEY)
            ./scripts/Build-WpmPackage.ps1 -Version '${{ github.ref_name }}' `
              -Architectures x86, x64, arm64 -SigningKey $keyPath
            wpm trust add release_keys/wfc-release.public
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $packages = @(Get-ChildItem out/packages/*.zip -File)
            if ($packages.Count -ne 2) {
              throw "Expected two packages, found $($packages.Count)."
            }
            foreach ($package in $packages) {
              wpm verify $package.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Get-FileHash out/packages/*.zip -Algorithm SHA256 |
              ForEach-Object {
                $name = Split-Path $_.Path -Leaf
                '{0}  {1}' -f $_.Hash.ToLowerInvariant(), $name
              } | Set-Content out/packages/SHA256SUMS -Encoding ascii
          } finally {
            Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload the signed packages
        uses: actions/upload-artifact@v7
        with:
          name: wfc-wpm-packages-${{ github.sha }}
          path: out/packages/*
          if-no-files-found: error
          retention-days: 30
