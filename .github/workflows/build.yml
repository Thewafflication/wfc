name: Build and test WFC

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      package_version:
        description: Version for a dry-run of the signed package job
        required: false
        default: ''

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned lint tools
        shell: pwsh
        run: |
          python -m pip install --requirement requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 `
            -Scope CurrentUser -Force

      - name: Lint
        shell: pwsh
        run: ./scripts/Invoke-Lint.ps1

  shared-libraries:
    name: Control libraries as DLLs
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      # The COM behaviour of the libraries (com_behaviour.hpp, the class
      # factories) and the black-box DLL tests build only with
      # WFC_OCX_SHARED=ON, which the Debug presets leave off.
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-x64-debug-shared

      - name: Build the DLLs and their tests
        shell: pwsh
        run: >
          cmake --build --preset windows-x64-debug-shared --target
          wfc_mscomctl wfc_mscomctl2 wfc_comdlg32 wfc_mswinsck wfc_vbrun
          mscomctl_dll_test mscomctl2_dll_test comdlg32_dll_test
          mswinsck_dll_test vbrun_dll_test

      - name: Test the DLLs
        shell: pwsh
        run: >
          ctest --preset windows-x64-debug-shared
          --tests-regex
          'TC-MP0010-.*dll|wfc-[a-z0-9]+-TC-[0-9]+-.*dll'
          --no-tests=error

  build:
    name: Debug ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            preset: windows-x86-debug
            runner: windows-2022
          - arch: x64
            preset: windows-x64-debug
            runner: windows-2022
          - arch: arm64
            preset: windows-arm64-debug
            runner: windows-11-arm

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure
        shell: pwsh
        run: cmake --preset '${{ matrix.preset }}'

      - name: Record runner context
        shell: pwsh
        run: |
          $directory = 'out/test-results/${{ matrix.arch }}'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $cachePath = 'out/build/${{ matrix.preset }}/CMakeCache.txt'
          $cache = Get-Content -LiteralPath $cachePath
          function Get-CacheValue([string]$Name) {
            $entry = $cache | Where-Object { $_ -match "^${Name}:[^=]*=" } |
              Select-Object -First 1
            if ($entry) { return ($entry -split '=', 2)[1] }
            return $null
          }
          $cmakeFiles = 'out/build/${{ matrix.preset }}/CMakeFiles'
          $compilerFile = Get-ChildItem $cmakeFiles `
              -Filter CMakeCXXCompiler.cmake -File -Recurse |
            Select-Object -First 1
          function Get-CMakeSetValue([string]$Name) {
            $pattern = '^set\(' + [regex]::Escape($Name) + ' "([^"]*)"\)'
            $match = Select-String -LiteralPath $compilerFile.FullName `
              -Pattern $pattern | Select-Object -First 1
            if ($match) { return $match.Matches[0].Groups[1].Value }
            return $null
          }
          [xml]$project = Get-Content `
            'out/build/${{ matrix.preset }}/wfc.vcxproj' -Raw
          $sdk = $project.SelectSingleNode(
            "//*[local-name()='WindowsTargetPlatformVersion']").InnerText
          [PSCustomObject]@{
            schemaVersion = 1
            sourceRevision = '${{ github.sha }}'
            targetArchitecture = '${{ matrix.arch }}'
            configuration = 'Debug'
            configurePreset = '${{ matrix.preset }}'
            runner = '${{ matrix.runner }}'
            runnerArchitecture = $env:RUNNER_ARCH
            runnerOs = $env:RUNNER_OS
            imageOs = $env:ImageOS
            imageVersion = $env:ImageVersion
            cmakeVersion = (& cmake --version)[0]
            ctestVersion = (& ctest --version)[0]
            cmakeGenerator = Get-CacheValue 'CMAKE_GENERATOR'
            generatorInstance = Get-CacheValue 'CMAKE_GENERATOR_INSTANCE'
            generatorPlatform = Get-CacheValue 'CMAKE_GENERATOR_PLATFORM'
            cxxCompiler = Get-CMakeSetValue 'CMAKE_CXX_COMPILER'
            cxxCompilerId = Get-CMakeSetValue 'CMAKE_CXX_COMPILER_ID'
            cxxCompilerVersion = Get-CMakeSetValue 'CMAKE_CXX_COMPILER_VERSION'
            windowsSdkVersion = $sdk
            wspRevision = (git -C wsp rev-parse HEAD)
            wcrtRevision = (git -C wcrt rev-parse HEAD)
          } | ConvertTo-Json -Depth 3 |
            Set-Content "$directory/context.json" -Encoding utf8NoBOM

      - name: Build
        shell: pwsh
        run: ./scripts/Invoke-Build.ps1 -Preset '${{ matrix.preset }}'

      - name: Test
        shell: pwsh
        run: |
          $result = Join-Path $PWD `
            'out/test-results/${{ matrix.arch }}/ctest.xml'
          ./scripts/Invoke-Tests.ps1 -Preset '${{ matrix.preset }}' `
            -JUnitPath $result

      - name: Record tested artifact identities
        if: always()
        shell: pwsh
        run: |
          $directory = 'out/test-results/${{ matrix.arch }}'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $binaryDirectory = 'out/build/${{ matrix.preset }}/Debug'
          $artifacts = @(
            Get-ChildItem -LiteralPath $binaryDirectory -File `
                -ErrorAction SilentlyContinue |
              Where-Object Extension -In '.exe', '.lib', '.pdb' |
              Sort-Object Name |
              ForEach-Object {
                [PSCustomObject]@{
                  name = $_.Name
                  size = $_.Length
                  sha256 = (Get-FileHash -LiteralPath $_.FullName `
                      -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              }
          )
          [PSCustomObject]@{
            schemaVersion = 1
            sourceRevision = '${{ github.sha }}'
            targetArchitecture = '${{ matrix.arch }}'
            configuration = 'Debug'
            jobStatusAtCollection = '${{ job.status }}'
            artifacts = $artifacts
          } | ConvertTo-Json -Depth 4 |
            Set-Content "$directory/artifacts.json" -Encoding utf8NoBOM

      - name: Upload Debug evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wfc-${{ matrix.arch }}-debug-${{ github.sha }}
          path: |
            out/build/${{ matrix.preset }}/Debug/*.exe
            out/build/${{ matrix.preset }}/Debug/*.lib
            out/build/${{ matrix.preset }}/Debug/*.pdb
            out/build/${{ matrix.preset }}/CMakeCache.txt
            out/build/${{ matrix.preset }}/CMakeFiles/*/CMakeCXXCompiler.cmake
            out/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            out/test-results/${{ matrix.arch }}/*.json
            out/test-results/${{ matrix.arch }}/*.xml
            out/build/${{ matrix.preset }}/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            preset: windows-x86-release
            runner: windows-2022
          - arch: x64
            preset: windows-x64-release
            runner: windows-2022
          - arch: arm64
            preset: windows-arm64-release
            runner: windows-11-arm

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Configure
        shell: pwsh
        run: cmake --preset '${{ matrix.preset }}'

      - name: Build
        shell: pwsh
        run: ./scripts/Invoke-Build.ps1 -Preset '${{ matrix.preset }}'

      - name: Test
        shell: pwsh
        run: |
          $result = Join-Path $PWD `
            'out/test-results/${{ matrix.arch }}-release/ctest.xml'
          ./scripts/Invoke-Tests.ps1 -Preset '${{ matrix.preset }}' `
            -JUnitPath $result

      - name: Record Release artifact identities
        if: always()
        shell: pwsh
        run: |
          $directory = 'out/test-results/${{ matrix.arch }}-release'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $binaryDirectory = 'out/build/${{ matrix.preset }}/Release'
          $artifacts = @(
            Get-ChildItem -LiteralPath $binaryDirectory -File `
                -ErrorAction SilentlyContinue |
              Where-Object Extension -In '.exe', '.dll' |
              Sort-Object Name |
              ForEach-Object {
                [PSCustomObject]@{
                  name = $_.Name
                  size = $_.Length
                  sha256 = (Get-FileHash -LiteralPath $_.FullName `
                      -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              }
          )
          [PSCustomObject]@{
            schemaVersion = 1
            sourceRevision = '${{ github.sha }}'
            targetArchitecture = '${{ matrix.arch }}'
            configuration = 'Release'
            jobStatusAtCollection = '${{ job.status }}'
            artifacts = $artifacts
          } | ConvertTo-Json -Depth 4 |
            Set-Content "$directory/artifacts.json" -Encoding utf8NoBOM

      - name: Collect package input
        shell: pwsh
        run: >
          ./scripts/Build-WpmPackage.ps1 -Collect
          -Architectures '${{ matrix.arch }}'

      - name: Upload package input
        uses: actions/upload-artifact@v7
        with:
          name: wfc-${{ matrix.arch }}-package-input
          path: out/package-input/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wfc-${{ matrix.arch }}-release-${{ github.sha }}
          path: |
            out/build/${{ matrix.preset }}/Release/*.exe
            out/test-results/${{ matrix.arch }}-release/*.json
            out/test-results/${{ matrix.arch }}-release/*.xml
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }} (Winelib)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      # Only what winegcc and wine64 need: with the recommended packages
      # (codecs, fonts, ...) the x64 runner's slow mirror took over 8
      # minutes. Each try gets 8 minutes, and a second follows a failed one.
      - name: Install Wine development packages
        timeout-minutes: 20
        run: |
          for attempt in 1 2; do
            if timeout 480 sudo apt-get update &&
              timeout 480 sudo apt-get install -y --no-install-recommends \
                wine wine64-tools libwine-dev wine64 gcc g++ cmake \
                ninja-build; then
              break
            fi
            if [ "$attempt" = 2 ]; then exit 1; fi
            echo "apt-get did not finish; trying again"
          done
          # Ubuntu keeps winegcc, wineg++ and the wine64 loader here.
          echo /usr/lib/wine >> "$GITHUB_PATH"
          ls /usr/lib/wine/wineg++ /usr/lib/wine/wine64 || command -v wineg++

      - name: Configure
        run: >
          cmake -S . -B out/winelib -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/winelib.cmake
          -DWFC_WINELIB_ARCH=${{ matrix.arch }}
          -DCMAKE_BUILD_TYPE=Release
          -DWFC_BUILD_TESTS=OFF
          -DWFC_WARNINGS_AS_ERRORS=OFF

      - name: Build
        run: cmake --build out/winelib --target wfc

      # Wine on the arm64 runner creates its prefix and then hangs, so only
      # the x64 program is run.
      - name: Run a program
        if: matrix.arch == 'x64'
        run: |
          printf 'Print 1 + 2\n' > out/smoke.bas
          # Ubuntu's wine64 package puts the loader in /usr/lib/wine.
          export PATH="/usr/lib/wine:$PATH" WINEDEBUG=-all
          output=$(timeout 300 wine64 out/winelib/wfc.exe.so out/smoke.bas)
          echo "$output"
          test "$(echo "$output" | tr -d ' \r')" = 3

      - name: Collect package input
        run: |
          target=out/package-input/linux-${{ matrix.arch }}
          mkdir -p "$target"
          cp out/winelib/wfc.exe out/winelib/wfc.exe.so "$target"

      - name: Upload package input
        uses: actions/upload-artifact@v7
        with:
          name: wfc-linux-${{ matrix.arch }}-package-input
          path: out/package-input/linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

  package:
    name: Signed WPM packages
    # Only a version tag builds the signed packages; publishing stays a
    # separate step that needs the owner's approval of the exact files.
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_version != '')
    needs: [build, release, linux]
    runs-on: windows-2022
    timeout-minutes: 30
    environment: release

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Download package input
        uses: actions/download-artifact@v7
        with:
          pattern: wfc-*-package-input
          path: out/package-input-download

      - name: Arrange package input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "out/package-input" | Out-Null
          foreach ($arch in 'x86', 'x64', 'arm64') {
            $from = "out/package-input-download/wfc-$arch-package-input"
            if (-not (Test-Path "$from/wfc.exe")) {
              throw "Missing package input for $arch."
            }
            Move-Item $from "out/package-input/$arch"
          }
          foreach ($arch in 'x64', 'arm64') {
            $from = "out/package-input-download/wfc-linux-$arch-package-input"
            if (-not (Test-Path "$from/wfc.exe.so")) {
              throw "Missing Linux package input for $arch."
            }
            Move-Item $from "out/package-input/linux-$arch"
          }

      - name: Install WPM
        shell: pwsh
        run: ./scripts/Install-Wpm.ps1

      - name: Build and verify the signed packages
        shell: pwsh
        env:
          WPM_PRIVATE_KEY: ${{ secrets.WPM_RELEASE_PRIVATE_KEY }}
          PACKAGE_VERSION: >-
            ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name ||
            inputs.package_version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WPM_PRIVATE_KEY)) {
            throw 'The release environment must define WPM_RELEASE_PRIVATE_KEY.'
          }
          if (-not (Test-Path release_keys/wfc-release.public)) {
            throw 'release_keys/wfc-release.public is missing.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'wfc-release.private'
          try {
            [IO.File]::WriteAllText($keyPath, $env:WPM_PRIVATE_KEY)
            ./scripts/Build-WpmPackage.ps1 -Version $env:PACKAGE_VERSION `
              -Architectures x86, x64, arm64 -LinuxArchitectures x64, arm64 `
              -SigningKey $keyPath
            wpm trust add release_keys/wfc-release.public
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $packages = @(Get-ChildItem out/packages/*.zip -File)
            if ($packages.Count -ne 4) {
              throw "Expected four packages, found $($packages.Count)."
            }
            foreach ($package in $packages) {
              wpm verify $package.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
          }

      # The wfc packages depend on the library packages at the versions of
      # lib/*/VERSION; their releases must exist first, and their entries go
      # into this release's index so it resolves the dependencies.
      - name: Download the library indexes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($library in 'vbrun', 'mscomctl', 'mscomctl2', 'comdlg32',
              'mswinsck') {
            $version = (Get-Content "lib/wfc-$library/VERSION" `
                -TotalCount 1).Trim()
            gh release download $version --repo "Thewafflication/wfc-$library" `
              --pattern index.json --dir "out/library-index/$library"
            if ($LASTEXITCODE -ne 0) {
              throw "No release $version of wfc-$library."
            }
          }

      - name: Generate WPM release index and checksums
        shell: pwsh
        env:
          RELEASE_TAG: >-
            ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name ||
            inputs.package_version }}
        run: |
          $include = @(Get-ChildItem out/library-index -Recurse `
              -Filter index.json).FullName
          ./scripts/New-WpmReleaseIndex.ps1 -Directory out/packages `
            -Tag $env:RELEASE_TAG -Include $include

      - name: Upload the signed packages
        uses: actions/upload-artifact@v7
        with:
          name: wfc-wpm-packages-${{ github.sha }}
          path: out/packages/*
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify the signed packages
    # A clean runner checks what the package job uploaded: the checksums,
    # the index and every package's signature against the release key.
    needs: package
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download the signed packages
        uses: actions/download-artifact@v7
        with:
          name: wfc-wpm-packages-${{ github.sha }}
          path: out/packages

      - name: Install WPM
        shell: pwsh
        run: ./scripts/Install-Wpm.ps1

      - name: Verify the checksums, the index and the signatures
        shell: pwsh
        run: ./scripts/Test-WpmRelease.ps1 -Directory out/packages -Count 4
