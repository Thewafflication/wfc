Option Explicit
Public Enum Mode
    ModeA = 1
    ModeB = 2
End Enum
Public Const Version As String = "1.0"
Private Const Secret As Long = 42
Public Current As Mode
Private Static_Count As Long
Public Function Bump() As Long
    Static n As Long
    n = n + 1
    Bump = n
End Function
Public Property Get Sec() As Long
    Sec = Secret
End Property
Friend Function Hidden() As String
    Hidden = "friend"
End Function
