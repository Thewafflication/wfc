# @file .pre-commit-config.yaml
# @brief WFC commit gate: lint, build, then tests of the changed modules
#        (WSP-CHECK-0001); a tag push runs the full suite.
# @note Setup and canonical commands: planning/commit-checks.md.
minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: wfc-gate-start
        name: WFC gate start (single instance, progress window)
        entry: pwsh -NoProfile -File scripts/Start-CommitGate.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: wfc-lint
        name: WFC lint
        entry: pwsh -NoProfile -File scripts/Invoke-Lint.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: wfc-build
        name: WFC build (windows-x64-debug)
        entry: pwsh -NoProfile -File scripts/Invoke-Build.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: wfc-tests
        name: WFC tests of the changed modules (windows-x64-debug)
        entry: pwsh -NoProfile -File scripts/Invoke-Tests.ps1 -Scope Changed
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: wfc-release-tests
        name: WFC full test suite for a tag push (all submodules)
        entry: pwsh -NoProfile -File scripts/Test-ReleasePush.ps1
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        require_serial: true
